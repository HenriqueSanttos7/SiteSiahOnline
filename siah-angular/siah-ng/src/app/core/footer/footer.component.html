<footer class="footer-links">
  <div class="container">
    <div class="footer-grid">
      <div *ngFor="let col of columns">
        <div class="f-col-title">{{ col.title }}</div>
        <ul class="f-col-links">
          <li *ngFor="let link of col.links">
            <a *ngIf="link.route; else extTpl" [routerLink]="link.route">{{ link.label }}<span *ngIf="link.sub" class="sub-info">{{ link.sub }}</span></a>
            <ng-template #extTpl>
              <a *ngIf="link.href; else plainTpl" [href]="link.href" target="_blank">{{ link.label }}</a>
              <ng-template #plainTpl><span class="f-plain">{{ link.label }}</span></ng-template>
            </ng-template>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
<div class="footer-bar">
  <div class="container footer-bar__inner">
    <div class="footer-bar__left">
      <span class="footer-logo">SIAH</span>
      <p>© 2024 SIAH Software e Serviços. Todos os direitos reservados.</p>
    </div>
    <div>
      <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-btn"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
      <a href="https://wa.me/5592981826512" target="_blank" class="social-btn"><i class="fab fa-whatsapp"></i></a>
    </div>
  </div>
</div>
