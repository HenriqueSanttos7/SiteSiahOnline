<!-- HERO -->
<section class="app-hero reveal" [style.background]="'linear-gradient(135deg, ' + app.corDark + ' 0%, ' + app.cor + ' 100%)'">
  <div class="container">
    <div class="app-hero__grid">

      <div class="app-hero__content">
        <p class="app-hero__sub">{{ app.subtitle }}</p>
        <h1 class="app-hero__title">{{ app.title }}</h1>
        <p class="app-hero__desc">{{ app.desc }}</p>
        <a routerLink="/contato" class="app-hero__btn">
          <i class="fa-solid fa-phone"></i>Entre em Contato!
        </a>
      </div>

      <div class="app-hero__img" [ngClass]="app.tipoLayout === 'mobile3D' ? 'layout-mobile' : 'layout-desktop'">
        <img [src]="app.img" [alt]="app.title">
      </div>

    </div>
  </div>
</section>

<!-- FUNCIONALIDADES -->
<section class="app-func-sec" *ngIf="app">
  <div class="container">
    
    <div class="modulo-header reveal">
      <div class="modulo-icon-box" [style.border-color]="app.cor" [style.color]="app.cor">
        <i class="fas fa-star"></i>
      </div>
      <h2 class="modulo-title" [style.color]="app.cor">Módulos</h2>
    </div>

    <ng-container *ngIf="temCategorias">
      
      <div *ngIf="desktopModulos.length > 0" class="categoria-section reveal d1">
        <h3 class="categoria-title" [style.color]="app.cor"><i class="fas fa-desktop"></i> Módulos Desktop</h3>
        <div class="modulo-grid">
          <div *ngFor="let f of desktopModulos" class="modulo-item">
            <div class="modulo-check" [style.border-color]="app.cor">
              <i [class]="f.icon" [style.color]="app.cor"></i>
            </div>
            <div>
              <span class="modulo-item-title" [innerHTML]="f.titulo"></span>
              <span class="modulo-item-sub">{{ f.desc }}</span>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="mobileModulos.length > 0" class="categoria-section reveal d1">
        <h3 class="categoria-title" [style.color]="app.cor"><i class="fas fa-mobile-alt"></i> Módulos Mobile</h3>
        <div class="modulo-grid">
          <div *ngFor="let f of mobileModulos" class="modulo-item">
            <div class="modulo-check" [style.border-color]="app.cor">
              <i [class]="f.icon" [style.color]="app.cor"></i>
            </div>
            <div>
              <span class="modulo-item-title" [innerHTML]="f.titulo"></span>
              <span class="modulo-item-sub">{{ f.desc }}</span>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="webModulos.length > 0" class="categoria-section reveal d1">
        <h3 class="categoria-title" [style.color]="app.cor"><i class="fas fa-globe"></i> Módulos Web</h3>
        <div class="modulo-grid">
          <div *ngFor="let f of webModulos" class="modulo-item">
            <div class="modulo-check" [style.border-color]="app.cor">
              <i [class]="f.icon" [style.color]="app.cor"></i>
            </div>
            <div>
              <span class="modulo-item-title" [innerHTML]="f.titulo"></span>
              <span class="modulo-item-sub">{{ f.desc }}</span>
            </div>
          </div>
        </div>
      </div>

    </ng-container>

    <div *ngIf="!temCategorias" class="modulo-grid reveal d1">
      <div *ngFor="let f of app?.funcionalidades" class="modulo-item">
        <div class="modulo-check" [style.border-color]="app.cor">
          <i [class]="f.icon" [style.color]="app.cor"></i>
        </div>
        <div>
          <span class="modulo-item-title" [innerHTML]="f.titulo"></span>
          <span class="modulo-item-sub">{{ f.desc }}</span>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- OUTRAS APLICAÇÕES -->
<section class="white-sec">
  <div class="container">
    <h2 class="title reveal" [style.color]="app.cor">Aplicações Disponíveis</h2>

    <div class="swiper apps-swiper reveal d1">
      <div class="swiper-wrapper">
        <div *ngFor="let a of apps" class="swiper-slide">
          <div class="app-nav-card" [routerLink]="['/apps', a.slug]">
            <div class="app-thumb">
              <img [src]="a.img" [alt]="a.title">
            </div>
            <div class="app-divider"></div>
            <div class="app-body">
              <h6>{{ a.title }}</h6>
              <p>{{ a.subtitle }}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>

<app-email-cta
  [title]="'Quer ver o ' + app.title + ' funcionando?'"
  subtitle="Agende uma demonstração gratuita com nosso time."
  [showSelect]="false">
</app-email-cta>
<app-footer></app-footer>
