<section class="email-cta">
  <div class="container text-center">
    <h2 class="email-cta__title">{{ title }}</h2>
    <p class="email-cta__sub">{{ subtitle }}</p>
    <div class="cta-form">
      <input type="text"  placeholder="Seu nome completo"          [(ngModel)]="nome">
      <input type="email" placeholder="Seu e-mail"                 [(ngModel)]="email">
      <input type="tel"   placeholder="WhatsApp (92) 9 0000-0000"  [(ngModel)]="whatsapp">
      <select *ngIf="showSelect" [(ngModel)]="interesse">
        <option value="">Interesse em...</option>
        <option value="soft">SIAH Soft — Sistema A7</option>
        <option value="cert">SIAH Cert — Certificado Digital</option>
        <option value="tech">SIAH Tech — Assistência Técnica</option>
      </select>
      <button class="cta-btn" (click)="submit()">
        <i class="fas fa-paper-plane"></i> Enviar
      </button>
    </div>
    <div class="cta-contacts">
      <a href="https://wa.me/5592981826512" target="_blank" class="cta-wpp">
        <i class="fab fa-whatsapp"></i> (92) 98182-6512
      </a>
      <span class="divider">|</span>
      <a href="mailto:contato@siahonline.com.br" class="cta-email">
        <i class="fas fa-envelope"></i> contato&#64;siahonline.com.br
      </a>
    </div>
  </div>
</section>
